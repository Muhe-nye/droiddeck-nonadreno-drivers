name: DD buffer release test module

on:
  push:
    branches: [fix/g925-black-screen]
    paths:
      - .github/workflows/dd-buffer-release.yml
      - patches/droiddeck-buffer-release/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Droid-Deck/DroidDeck
          ref: 9ae771c50d575fa94de93c577e5d8bc653011a68
          path: droiddeck-source
      - name: Apply compositor patch
        run: git -C droiddeck-source apply --check ../patches/droiddeck-buffer-release/buffer-release.patch && git -C droiddeck-source apply ../patches/droiddeck-buffer-release/buffer-release.patch
      - name: Test production buffer lifecycle functions
        working-directory: droiddeck-source
        run: |
          python3 tools/tests/test_vk_dmabuf_quarantine.py -v
          python3 tools/tests/test_buffer_release_trace.py -v
          python3 tools/tests/test_vk_pending_completion.py -v
          python3 tools/tests/test_pointer_release.py -v
          python3 tools/tests/test_steam_presentation.py -v
      - name: Prepare NDK
        run: |
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          if [ ! -d "$NDK_PATH" ]; then sdkmanager 'ndk;27.3.13750724'; fi
          echo "DD_NDK=$NDK_PATH" >> "$GITHUB_ENV"
      - name: Build display module with frame generation engines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('droiddeck-source/app/src/main/cpp/CMakeLists.txt')
          source = p.read_text()
          excluded = 'add_subdirectory(questxr)\n'
          assert source.count(excluded) == 1
          p.write_text(source.replace(excluded, ''))
          PY
          cmake -S droiddeck-source/app/src/main/cpp -B native-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DD_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release
          cmake --build native-build --target droiddeckwayland --parallel 4
      - name: Collect module and provenance
        run: |
          mkdir module
          cp native-build/waylandcomp/libdroiddeckwayland.so module/
          cp patches/droiddeck-buffer-release/buffer-release.patch module/
          git -C droiddeck-source diff -- app/src/main/cpp/CMakeLists.txt > module/build-scope.patch
          printf 'DD source: %s\nPatch repository commit: %s\nNDK: %s\nABI: arm64-v8a\n' \
            9ae771c50d575fa94de93c577e5d8bc653011a68 "$GITHUB_SHA" 27.3.13750724 > module/provenance.txt
          "$DD_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d -h module/libdroiddeckwayland.so > module/elf-info.txt
          cd module
          sha256sum libdroiddeckwayland.so buffer-release.patch build-scope.patch provenance.txt elf-info.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dd-buffer-release-arm64
          path: module/
          retention-days: 14
